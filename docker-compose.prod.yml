services:
  ledgerflow:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LEDGERFLOW_PORT:-3000}:3000"
    environment:
      LEDGERFLOW_API_TOKEN: ${LEDGERFLOW_API_TOKEN:?Set LEDGERFLOW_API_TOKEN before starting LedgerFlow}
      LEDGERFLOW_API_TOKENS: ${LEDGERFLOW_API_TOKENS:-}
      LEDGERFLOW_DB_URL: ${LEDGERFLOW_DB_URL:-postgres://ledgerflow@postgres:5432/ledgerflow}
      LEDGERFLOW_BODY_LIMIT_BYTES: ${LEDGERFLOW_BODY_LIMIT_BYTES:-1048576}
      LEDGERFLOW_RATE_LIMIT_MAX: ${LEDGERFLOW_RATE_LIMIT_MAX:-300}
      LEDGERFLOW_RATE_LIMIT_WINDOW: ${LEDGERFLOW_RATE_LIMIT_WINDOW:-1 minute}
      LEDGERFLOW_LOGS: ${LEDGERFLOW_LOGS:-1}
      LEDGERFLOW_SERVE_WEB: "1"
      LEDGERFLOW_WEB_ROOT: /app/web/dist
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ledgerflow-runtime:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: ledgerflow
      POSTGRES_HOST_AUTH_METHOD: trust
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerflow -d ledgerflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ledgerflow-postgres:/var/lib/postgresql/data

volumes:
  ledgerflow-runtime:
  ledgerflow-postgres:
